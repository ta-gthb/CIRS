{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h2>{{ _('Login / Register') }}</h2>
    <form method="POST" id="loginForm">
        <div class="form-group">
            <label>{{ _('Mobile Number') }}</label>
            <div class="box-input-container phone-container">
                {% for i in range(10) %}
                <input type="text" class="box-input phone-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                {% endfor %}
            </div>
            <input type="hidden" name="phone" id="fullPhone">
        </div>
        <div class="form-group">
            <label>{{ _('I am a:') }}</label>
            <div class="role-selector">
                <input type="radio" name="role" value="citizen" id="citizen" checked>
                <label for="citizen">{{ _('Citizen') }}</label>
                <input type="radio" name="role" value="authority" id="authority">
                <label for="authority">{{ _('Officer') }}</label>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ _('Send OTP') }}</button>
    </form>
    <p class="hint">{{ _('Demo OTP: 1234') }}</p>
</div>

<style>
    .box-input-container { display: flex; justify-content: center; gap: 8px; margin-top: 1rem; }
    .box-input { width: 35px; height: 45px; text-align: center; font-size: 1.2rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-color); }
    .box-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
    .phone-container .box-input { width: 30px; }
    .role-selector { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
    .hint { margin-top: 1rem; color: var(--secondary-color); font-size: 0.9rem; }
</style>
{% endblock %}

{% block scripts %}
<script>
    const phoneBoxes = document.querySelectorAll('.phone-box');
    const fullPhone = document.getElementById('fullPhone');
    const form = document.getElementById('loginForm');

    function setupBoxNavigation(boxes) {
        boxes.forEach((box, idx) => {
            box.addEventListener('focus', () => box.select());
            
            box.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val.length === 1 && idx < boxes.length - 1) {
                    boxes[idx + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && idx > 0) {
                    boxes[idx - 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const data = (e.clipboardData || window.clipboardData).getData('text');
                const digits = data.replace(/\D/g, '').split('');
                digits.forEach((digit, i) => {
                    if (idx + i < boxes.length) {
                        boxes[idx + i].value = digit;
                        if (idx + i < boxes.length - 1) boxes[idx + i + 1].focus();
                    }
                });
            });
        });
    }

    setupBoxNavigation(phoneBoxes);

    form.addEventListener('submit', (e) => {
        let phoneVal = '';
        phoneBoxes.forEach(box => phoneVal += box.value);
        if (phoneVal.length !== 10) {
            e.preventDefault();
            alert("{{ _('Please enter 10 digits') }}");
        } else {
            fullPhone.value = phoneVal;
        }
    });
</script>
{% endblock %}
