{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h2>{{ _('Login / Register') }}</h2>
    <form method="POST" id="loginForm">
        <div class="form-group">
            <label>{{ _('I am a:') }}</label>
            <div class="role-selector">
                <input type="radio" name="role" value="citizen" id="citizen" checked>
                <label for="citizen">{{ _('Citizen') }}</label>
                <input type="radio" name="role" value="authority" id="authority">
                <label for="authority">{{ _('Officer') }}</label>
            </div>
        </div>

        <div id="phoneSection">
            <div class="form-group">
                <label>{{ _('Mobile Number') }}</label>
                <div class="box-input-container phone-container">
                    {% for i in range(10) %}
                    <input type="text" class="box-input phone-box" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    {% endfor %}
                </div>
                <input type="hidden" name="phone" id="fullPhone">
            </div>
        </div>

        <div id="adminSection" style="display: none;">
            <div class="form-group">
                <label>{{ _('Username') }}</label>
                <input type="text" name="username" class="form-control" placeholder="{{ _('Enter username') }}">
            </div>
            <div class="form-group">
                <label>{{ _('Password') }}</label>
                <input type="password" name="password" class="form-control" placeholder="{{ _('Enter password') }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">{{ _('Send OTP') }}</button>
    </form>
    <p class="hint" id="demoHint">{{ _('Demo OTP: 1234') }}</p>
</div>

<style>
    .box-input-container { display: flex; justify-content: center; gap: clamp(4px, 2vw, 8px); margin-top: 1rem; }
    .box-input { width: clamp(26px, 7.5vw, 35px); height: clamp(38px, 10vw, 45px); text-align: center; font-size: clamp(0.9rem, 3vw, 1.2rem); border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-color); flex-shrink: 0; }
    .box-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
    .phone-container .box-input { width: clamp(24px, 7vw, 30px); }
    .role-selector { display: flex; justify-content: center; gap: 2rem; margin: 1.5rem 0; }
    .hint { margin-top: 1rem; color: var(--secondary-color); font-size: 0.9rem; }
</style>
{% endblock %}

{% block scripts %}
<script>
    const phoneBoxes = document.querySelectorAll('.phone-box');
    const fullPhone = document.getElementById('fullPhone');
    const form = document.getElementById('loginForm');

    function setupBoxNavigation(boxes) {
        boxes.forEach((box, idx) => {
            box.addEventListener('focus', () => box.select());
            
            box.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val.length === 1 && idx < boxes.length - 1) {
                    boxes[idx + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !box.value && idx > 0) {
                    boxes[idx - 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const data = (e.clipboardData || window.clipboardData).getData('text');
                const digits = data.replace(/\D/g, '').split('');
                digits.forEach((digit, i) => {
                    if (idx + i < boxes.length) {
                        boxes[idx + i].value = digit;
                        if (idx + i < boxes.length - 1) boxes[idx + i + 1].focus();
                    }
                });
            });
        });
    }

    setupBoxNavigation(phoneBoxes);

    // Role Toggle Logic
    const citizenRadio = document.getElementById('citizen');
    const authorityRadio = document.getElementById('authority');
    const phoneSection = document.getElementById('phoneSection');
    const adminSection = document.getElementById('adminSection');
    const submitBtn = document.getElementById('submitBtn');
    const demoHint = document.getElementById('demoHint');
    const phoneInputs = document.querySelectorAll('.phone-box');
    const adminInputs = adminSection.querySelectorAll('input');

    function toggleRole() {
        if (citizenRadio.checked) {
            phoneSection.style.display = 'block';
            adminSection.style.display = 'none';
            submitBtn.innerText = "{{ _('Send OTP') }}";
            demoHint.style.display = 'block';
            phoneInputs.forEach(i => i.required = true);
            adminInputs.forEach(i => i.required = false);
        } else {
            phoneSection.style.display = 'none';
            adminSection.style.display = 'block';
            submitBtn.innerText = "{{ _('Login') }}";
            demoHint.style.display = 'none';
            phoneInputs.forEach(i => i.required = false);
            adminInputs.forEach(i => i.required = true);
        }
    }

    citizenRadio.addEventListener('change', toggleRole);
    authorityRadio.addEventListener('change', toggleRole);
    toggleRole(); // Initial state

    form.addEventListener('submit', (e) => {
        if (citizenRadio.checked) {
            let phoneVal = '';
            phoneBoxes.forEach(box => phoneVal += box.value);
            if (phoneVal.length !== 10) {
                e.preventDefault();
                alert("{{ _('Please enter 10 digits') }}");
            } else {
                fullPhone.value = phoneVal;
            }
        }
    });
    </script>
    {% endblock %}
