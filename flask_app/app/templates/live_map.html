{% extends "base.html" %}

{% block content %}
<div class="live-map-container">
    <h2>{{ _('Live Map - Community Issues') }}</h2>
    <div id="live-map" style="height: 700px; border-radius: 12px; box-shadow: var(--shadow); border: 4px solid var(--card-bg); transition: border-color 0.3s;"></div>
    
    <div class="map-legend">
        <h4>{{ _('Legend') }}</h4>
        <div class="legend-item"><span class="dot critical"></span> {{ _('Critical') }}</div>
        <div class="legend-item"><span class="dot high"></span> {{ _('High') }}</div>
        <div class="legend-item"><span class="dot medium"></span> {{ _('Medium') }}</div>
        <div class="legend-item"><span class="dot low"></span> {{ _('Low') }}</div>
    </div>
</div>

<style>
    .live-map-container h2 { margin-bottom: 1.5rem; text-align: center; }
</style>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    function initMap() {
        const defaultCenter = [22.5726, 88.3639];
        const map = L.map('live-map').setView(defaultCenter, 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const reports = [
            {% for report in reports %}
                {% if report.latitude and report.longitude %}
                {
                    lat: {{ report.latitude }},
                    lng: {{ report.longitude }},
                    title: "{{ report.title|replace('"', '\\"') }}",
                    category: "{{ _(report.category) }}",
                    priority: "{{ _(report.priority) }}",
                    status: "{{ _(report.status|replace('_', ' ')) }}"
                },
                {% endif %}
            {% endfor %}
        ];

        reports.forEach(report => {
            const markerColor = getMarkerColor(report.priority);
            const marker = L.circleMarker([report.lat, report.lng], {
                radius: 10,
                fillColor: markerColor,
                color: "#fff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);

            const popupContent = `
                <div class="popup-note">
                    <h4>${report.title}</h4>
                    <p><strong>{{ _('Category:') }}</strong> ${report.category}</p>
                    <p><strong>{{ _('Priority:') }}</strong> <span style="color:${markerColor}; font-weight:bold;">${report.priority.toUpperCase()}</span></p>
                    <p><strong>{{ _('Status:') }}</strong> ${report.status}</p>
                </div>
            `;
            marker.bindPopup(popupContent);
        });

        if (reports.length > 0) {
            const group = new L.featureGroup(reports.map(r => L.marker([r.lat, r.lng])));
            map.fitBounds(group.getBounds().pad(0.1));
        }
    }

    function getMarkerColor(priority) {
        // We use the English key for color logic, but we might have translated it in the template
        // So we should be careful. Actually, it's better to pass the raw priority for color logic.
        const p = priority.toLowerCase();
        if (p.includes('critical')) return '#dc3545';
        if (p.includes('high')) return '#fd7e14';
        if (p.includes('medium')) return '#ffc107';
        if (p.includes('low')) return '#6c757d';
        return '#007bff';
    }

    window.onload = initMap;
</script>
{% endblock %}
