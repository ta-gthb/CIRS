{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h2>{{ _('Verify OTP') }}</h2>
    <p>{{ _('Sent to:') }} {{ phone }}</p>
    <form method="POST" id="otpForm">
        <div class="form-group">
            <label>{{ _('Enter 4-Digit OTP') }}</label>
            <div class="box-input-container">
                {% for i in range(4) %}
                <input type="text" class="box-input otp-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                {% endfor %}
            </div>
            <input type="hidden" name="otp" id="fullOtp">
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ _('Verify & Login') }}</button>
    </form>
</div>

<style>
    .auth-card { max-width: 400px; }
    .box-input-container { display: flex; justify-content: center; gap: 15px; margin: 1.5rem 0; }
    .box-input { width: 50px; height: 60px; text-align: center; font-size: 1.5rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-color); }
    .box-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
</style>
{% endblock %}

{% block scripts %}
<script>
    const boxes = document.querySelectorAll('.otp-box');
    const fullOtp = document.getElementById('fullOtp');
    const form = document.getElementById('otpForm');

    boxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && idx < boxes.length - 1) {
                boxes[idx + 1].focus();
            }
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                boxes[idx - 1].focus();
            }
        });
    });

    form.addEventListener('submit', (e) => {
        let otpVal = '';
        boxes.forEach(box => otpVal += box.value);
        if (otpVal.length !== 4) {
            e.preventDefault();
            alert("{{ _('Please enter 4 digits') }}");
        } else {
            fullOtp.value = otpVal;
        }
    });
</script>
{% endblock %}
